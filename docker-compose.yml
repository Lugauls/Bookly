services:
  postgres:
    image: postgres:17-alpine
    container_name: bookly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookly}
      POSTGRES_DB: ${POSTGRES_DB:-bookly}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bookly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookly} -d ${POSTGRES_DB:-bookly}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookly_postgres_data:
